<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Magic Door Preview</title>
    <!-- Confetti for inside effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #0f172a; font-family: sans-serif; overflow: hidden; }

        /* The Magical World Behind The Door */
        .behind-door-world {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle, #1e1b4b 0%, #000000 100%);
            z-index: 1;
        }
        .glow-text {
            color: #c2e7ff; font-size: 24px; font-weight: bold;
            text-shadow: 0 0 20px #c2e7ff; animation: pulse 2s infinite;
        }

        /* 3D Splash Container */
        .splash-3d-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999; perspective: 1200px; display: flex;
            pointer-events: auto; background: transparent;
        }

        /* The Doors */
        .door {
            position: absolute; top: 0; width: 50%; height: 100%;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
            border: 2px solid #334155;
        }
        .door-left { left: 0; transform-origin: left; }
        .door-right { right: 0; transform-origin: right; }

        /* Sliding Windows (The Peek Illusion) */
        .window-frame {
            width: 100px; height: 140px; 
            border: 4px solid #475569; border-radius: 8px;
            position: relative; overflow: hidden;
            background: url('https://media.giphy.com/media/26tOZ42Mg6pbTUPHW/giphy.gif') center/cover;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9), 0 10px 20px rgba(0,0,0,0.5);
        }
        .shutter {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, #334155, #334155 10px, #1e293b 10px, #1e293b 20px);
            display: flex; justify-content: center; align-items: flex-end; padding-bottom: 10px;
            color: #94a3b8; font-size: 12px; font-weight: bold;
            transition: transform 0.1s; cursor: grab;
        }

        /* Professional Metallic Lock */
        .magic-lock-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10; display: flex; flex-direction: column; align-items: center;
            transition: opacity 0.4s, transform 0.4s;
        }
        .metallic-lock {
            width: 80px; height: 80px; border-radius: 50%; cursor: pointer;
            background: linear-gradient(145deg, #e2e8f0, #94a3b8);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 4px 10px rgba(255,255,255,0.8);
            display: flex; justify-content: center; align-items: center;
            border: 4px solid #cbd5e1; transition: transform 0.2s;
        }
        .metallic-lock:active {
            transform: scale(0.9); box-shadow: 0 2px 5px rgba(0,0,0,0.5), inset 0 4px 10px rgba(0,0,0,0.3);
        }
        .lock-core {
            width: 30px; height: 30px; border-radius: 50%;
            background: radial-gradient(circle, #ef4444 20%, #991b1b 100%);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            animation: pulse 2s infinite;
        }
        .touch-text {
            color: white; margin-top: 15px; font-weight: bold; letter-spacing: 1px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.8); animation: pulse 2s infinite;
        }

        /* Door Open Animations */
        .splash-3d-container.open .door-left { transform: rotateY(-105deg); }
        .splash-3d-container.open .door-right { transform: rotateY(105deg); }
        .splash-3d-container.open .magic-lock-container { opacity: 0; transform: translate(-50%, -50%) scale(1.5); pointer-events: none; }
        .splash-3d-container.hidden { opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    </style>
</head>
<body>

    <!-- Inside Content -->
    <div class="behind-door-world">
        <div class="glow-text">🎉 Magic Unlocked! 🎉</div>
    </div>

    <!-- 3D Splash Screen -->
    <div id="splash-screen" class="splash-3d-container">
        
        <!-- Left Door & Window -->
        <div class="door door-left">
            <div class="window-frame">
                <div class="shutter" id="shutter-left">Slide ⬇</div>
            </div>
        </div>

        <!-- Right Door & Window -->
        <div class="door door-right">
            <div class="window-frame">
                <div class="shutter" id="shutter-right">Slide ⬇</div>
            </div>
        </div>

        <!-- Main Lock -->
        <div class="magic-lock-container" id="main-lock">
            <div class="metallic-lock" onclick="openDoors()">
                <div class="lock-core"></div>
            </div>
            <div class="touch-text">TOUCH TO OPEN</div>
        </div>
    </div>

    <script>
        // 1. Sliding Window Logic (Curiosity Trap)
        function setupShutter(shutterId) {
            const shutter = document.getElementById(shutterId);
            let startY = 0;

            shutter.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
                shutter.style.transition = 'none';
            });

            shutter.addEventListener('touchmove', (e) => {
                let currentY = e.touches[0].clientY;
                let diff = currentY - startY;
                
                // Only slide downwards, max 100px
                if(diff > 0 && diff <= 100) {
                    shutter.style.transform = `translateY(${diff}px)`;
                }
            });

            shutter.addEventListener('touchend', () => {
                // Snap back to close when finger is removed (increases curiosity)
                shutter.style.transition = 'transform 0.3s ease';
                shutter.style.transform = `translateY(0px)`;
            });
        }

        setupShutter('shutter-left');
        setupShutter('shutter-right');

        // 2. Door Opening Logic
        window.openDoors = function() {
            let splash = document.getElementById('splash-screen');
            splash.classList.add('open');
            
            // Trigger Fireworks behind the door
            setTimeout(() => {
                confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
            }, 600);

            // Remove splash screen fully after animation
            setTimeout(() => {
                splash.classList.add('hidden');
            }, 1200);
        };
    </script>
</body>
</html>
